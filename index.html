<style>

  /* work task card */
  #taskCard { position:fixed; left:8px; bottom:calc(10px + env(safe-area-inset-bottom)); width:min(57vw,340px); background:rgba(255,253,246,.98); border-radius:18px; box-shadow:0 10px 34px rgba(0,0,0,.4); padding:12px 14px 13px; z-index:9; text-align:center; }

  .pad button:active { transform:translateY(2px); box-shadow:0 1px 0 #c8d2b4; }
  .stampRow { display:flex; gap:9px; flex-wrap:wrap; justify-content:center; max-width:210px; }
  .stampBox { width:56px; height:56px; border:2.5px dashed #c3cfae; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:30px; cursor:pointer; background:#fff; }
  .stampBox.done { border-style:solid; border-color:#d64545; color:#d64545; font-weight:900; }
  .calcQ { font-size:27px; font-weight:900; color:#26331f; }
  .choiceRow { display:flex; gap:8px; }
  .choiceRow button { border:none; border-radius:12px; background:#eef2e4; padding:11px 20px; font-size:18px; font-weight:900; color:#33412a; cursor:pointer; font-family:inherit; box-shadow:0 3px 0 #c8d2b4; }
  .docTab { font-size:15px; font-weight:900; padding:8px 18px; border-radius:10px; color:#fff; }
  /* ring banner + grab target */
  #ringBanner { position:fixed; top:19%; left:50%; transform:translateX(-50%); z-index:11; background:#d64545; color:#fff; font-size:24px; font-weight:900; border-radius:999px; padding:12px 30px; box-shadow:0 8px 30px rgba(214,69,69,.55); animation:shake .12s infinite; white-space:nowrap; }
  @keyframes shake { 0%{transform:translateX(-50%) rotate(-1.2deg)} 50%{transform:translateX(calc(-50% + 2px)) rotate(1.2deg)} 100%{transform:translateX(-50%) rotate(-1.2deg)} }
  #grabBtn { position:fixed; z-index:10; border:none; border-radius:50%; background:rgba(255,183,3,.28); box-shadow:0 0 0 3px rgba(255,183,3,.85), 0 0 34px rgba(255,183,3,.65); cursor:pointer; animation:pulse .5s infinite alternate; }
  @keyframes pulse { from{ transform:scale(1);} to{ transform:scale(1.07);} }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:12; }
  #bubble { position:fixed; z-index:10; background:#fff; border-radius:14px; padding:8px 15px; font-weight:900; font-size:17px; color:#26331f; box-shadow:0 6px 20px rgba(0,0,0,.35); transform:translate(-50%,-118%) scale(.5); opacity:0; transition:all .18s ease; pointer-events:none; white-space:nowrap; }
  #bubble.show { opacity:1; transform:translate(-50%,-118%) scale(1); }
  #bubble::after { content:''; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%); border:8px solid transparent; border-top-color:#fff; border-bottom:0; }
  #bossBubble { position:fixed; z-index:10; top:16%; left:50%; background:#3a0d0d; color:#ffb3b3; border-radius:14px; padding:10px 18px; font-weight:900; font-size:18px; box-shadow:0 8px 26px rgba(0,0,0,.5); transform:translate(-50%,0) scale(.5); opacity:0; transition:all .18s ease; pointer-events:none; white-space:nowrap; }
  #bossBubble.show { opacity:1; transform:translate(-50%,0) scale(1); }
  #bossBubble::after { content:''; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%); border:8px solid transparent; border-top-color:#3a0d0d; border-bottom:0; }
  .bigScore { font-size:30px; font-weight:900; color:#26331f; margin:4px 0; }
  .msWin { color:#1d9e4b; } .msLose { color:#d64545; }
  .ladderRow { display:flex; justify-content:space-between; padding:6px 4px; font-size:13.5px; font-weight:800; color:#5a6e4c; border-bottom:1px dashed #dde4cd; }
  .ladderRow.done { color:#1d9e4b; } .ladderRow.now { color:#b45309; }
  .ladderRow.pick { cursor:pointer; background:#f4f6ee; border-radius:10px; padding:8px 8px; border-bottom:none; margin:3px 0; }
  .ladderRow.pick:active { background:#e6ecd8; }
</style>

  <div id="taskTitle">仕事中…</div><div id="taskMsg" style="font-size:12px;font-weight:900;color:#d64545;min-height:16px"></div><div id="scoldInfo" style="font-size:11.5px;font-weight:900;color:#d64545;min-height:15px"></div>

    <div class="lbl" style="text-align:center">対戦相手</div>

    <button class="btn main" id="stageGoBtn">仕事開始</button>
    <button class="btn sub" id="stageBackBtn">タイトルへ</button>

</div>

<div id="loadErr" class="screen hidden"><div class="card"><h2>読み込みに失敗しました</h2><p style="font-weight:700;color:#77875f;font-size:13px;margin-top:8px">通信環境を確認して、もう一度開いてください。</p></div></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k, d) {
    try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch (e) {}
    try { const m = document.cookie.match(new RegExp('(?:^|; )' + k + '=([^;]*)')); if (m) return JSON.parse(decodeURIComponent(m[1])); } catch (e) {}
    return d;
  },
  set(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
    try { document.cookie = k + '=' + encodeURIComponent(JSON.stringify(v)) + '; max-age=31536000; path=/; SameSite=Lax'; } catch (e) {}
  },
};
/* ================= AUDIO (synth) ================= */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, t0, dur, type, vol, slideTo) {
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, c.currentTime + t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + t0 + dur);
  g.gain.setValueAtTime(0.0001, c.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.12, c.currentTime + t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
  o.connect(g); g.connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.05);
}
const sfx = {
  ok() { tone(880, 0, 0.07, 'sine', 0.1); tone(1320, 0.06, 0.1, 'sine', 0.1); },
  bad() { tone(160, 0, 0.14, 'square', 0.06); },
  type() { tone(1200 + Math.random() * 500, 0, 0.03, 'square', 0.03); },
  pickup() { tone(500, 0, 0.05, 'square', 0.08); tone(900, 0.05, 0.08, 'sine', 0.1); },
  win() { [660, 880, 1100, 1470].forEach((f, i) => tone(f, i * 0.09, 0.16, 'triangle', 0.12)); },
  lose() { [420, 340, 260].forEach((f, i) => tone(f, i * 0.12, 0.18, 'triangle', 0.1)); },
};
let ringTimer = null;
function ringStart() {
  const pulse = () => { for (let i = 0; i < 7; i++) tone(i % 2 ? 440 : 480, i * 0.055, 0.05, 'square', 0.045); };
  pulse(); ringTimer = setInterval(pulse, 1000);
}
function ringStop() { if (ringTimer) { clearInterval(ringTimer); ringTimer = null; } }
/* ================= GAME STATE ================= */
const STAGES = [
  { name: '同期のタナカ', face: '🧑', ms: 650, desc: 'まだ余裕。でも油断すると先に取られる。' },
  { name: '先輩のスズキ', face: '🧑‍💼', ms: 530, desc: '電話番の経験が違う。鳴った瞬間に手が動く。' },
  { name: '課長のサトウ', face: '👨‍💼', ms: 440, desc: '周りの部下も巻き込んで一斉に鳴る。速い。' },
  { name: '部長のヤマダ', face: '👴', ms: 350, desc: '若い頃は電話番で名を馳せた男。かなり速い。' },
  { name: '社長のオオタ', face: '🤴', ms: 270, desc: '伝説の電話番。鳴る前に手が動くという噂。' },
  { name: 'アレクサンダー・グラハム・ベル', face: '👨‍🔬', ms: 195, desc: '' },
];
function racersFor(stage) {
  if (stage < 2) return [{ side: 'left', st: STAGES[stage] }];
  if (stage === 4) return [{ side: 'left', st: STAGES[4] }, { side: 'right', st: STAGES[3] }];
  return [{ side: 'left', st: STAGES[stage] }, { side: 'right', st: STAGES[stage - 1] }];
}
const G = {
  screen: 'title', stage: store.get('phone_progress', 0), phase: 'idle', // idle|work|ring|done
  workPt: store.get('phone_workpt', 0), bestMs: store.get('phone_bestms', 0), runWorkPt: 0, ringAt: 0, ringStart: 0, myMs: null, racers: [], taskTimer: null, ringTO: null, scolds: 0, taskStart: 0, taskActive: false,
  meGrab: 0, leftGrab: 0, rightGrab: 0, grabAnim: null, result: null, rivalWon: null, loseAt: 0, resultAt: 0,
};
function showScreen(name) {
  G.screen = name || 'none';
  for (const [id, key] of [['screenTitle', 'title'], ['screenStage', 'stage'], ['screenResult', 'result'], ['screenRank', 'rank']]) $(id).classList.toggle('hidden', name !== key);
  if (name) { $('hud').classList.add('hidden'); $('quitBtn').classList.add('hidden'); }
}
function renderLadder() {
  const tf = titleFor(G.workPt);
  $('nameTitle').textContent = tf.name;
  $('titleWorkPt').innerHTML = '🏅 ' + tf.name + '｜累計 ' + G.workPt + ' pt' + (tf.next ? '（あと' + tf.remain + 'ptで「' + tf.next + '」）' : '（最高位）') + (G.bestMs ? '<br>⚡ 受話器ベスト ' + (G.bestMs / 1000).toFixed(3) + '秒' : '');
  $('workPt').textContent = G.workPt;
  const prog = store.get('phone_progress', 0);
  $('ladderBox').innerHTML = '<div class="lbl">📈 出世街道（タップで選べる）</div>' + STAGES.map((s, i) => {
    if (i === 5 && prog < 5) return '<div class="ladderRow"><span>❓ ？？？</span><span>―</span></div>';
    return `<div class="ladderRow ${i < prog ? 'done' : i === prog ? 'now' : ''} ${i <= prog ? 'pick' : ''}" ${i <= prog ? 'data-stage="' + i + '"' : ''}><span>${s.face} ${s.name}</span><span>${i < prog ? '制覇 ✓' : i === prog ? '現在の相手' : '―'}</span></div>`;
  }).join('');
  for (const row of $('ladderBox').querySelectorAll('[data-stage]')) row.onclick = () => { ac(); G.stage = parseInt(row.dataset.stage, 10); openStage(); };
}
/* ================= WORK TASKS ================= */
function taskMistake(msg) {
  G.failMsg = msg || '';
  if (G.phase !== 'work' || !G.taskActive) return;
  G.taskActive = false;
  if (G.taskTimer) { clearTimeout(G.taskTimer); clearInterval(G.taskTimer); G.taskTimer = null; }
  $('taskCard').classList.add('hidden');
  sfx.bad();
  $('scoldBanner').textContent = '💢 上司「ミスするな！しっかりしろ！」';
  $('scoldBanner').classList.remove('hidden');
  document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake');
  setTimeout(() => { $('scoldBanner').classList.add('hidden'); failByScold('mistake'); }, 1000);
}
const TASK_DEFS = [
  { title: '💻 キーボード入力：表示された数字を打て', make(body, done) {
      const code = String(Math.floor(1000 + Math.random() * 9000));
      let entered = '';
      const show = document.createElement('div'); show.className = 'codeShow'; show.textContent = code;
      const dots = document.createElement('div'); dots.className = 'codeDots'; dots.style.letterSpacing = '6px';
      const upd = () => dots.textContent = (entered + '○'.repeat(4 - entered.length)).split('').join(' ');
      upd();
      const pad = document.createElement('div'); pad.className = 'pad';
      for (const dgt of ['1','2','3','4','5','6','7','8','9','0','⌫']) {
        const b = document.createElement('button'); b.textContent = dgt;
        b.onclick = () => {
          if (dgt === '⌫') { entered = entered.slice(0, -1); upd(); sfx.type(); return; }
          if (entered.length >= 4) return;
          sfx.type(); entered += dgt; upd();
          if (entered.length === 4) {
            if (entered === code) done();
            else { taskMistake('数字を間違えた'); entered = ''; upd(); }
          }
        };
        pad.appendChild(b);
      }
      body.append(show, dots, pad);
  } },
  { title: '📄 書類にハンコを押せ（✕は押すな）', make(body, done) {
      const row = document.createElement('div'); row.className = 'stampRow';
      let n = 0;
      const boxes = [];
      for (let i = 0; i < 3; i++) {
        const b = document.createElement('div'); b.className = 'stampBox'; b.textContent = '・';
        b.onclick = () => { if (b.classList.contains('done')) return; b.classList.add('done'); b.textContent = '済'; sfx.type(); if (++n >= 3) done(); };
        boxes.push(b);
      }
      const decoy = document.createElement('div'); decoy.className = 'stampBox'; decoy.textContent = '✕'; decoy.style.color = '#d64545'; decoy.style.fontSize = '15px'; decoy.style.fontWeight = '900';
      decoy.onclick = () => taskMistake('押してはいけない書類にハンコを押した');

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 18, 14), new THREE.MeshStandardMaterial({ color: skin, roughness: 0.7 })); head.position.set(0, 1.56, 0.24); g.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.145, 18, 12, 0, Math.PI * 2, 0, 1.4), new THREE.MeshStandardMaterial({ color: 0x2b2320 })); hair.position.set(0, 1.585, 0.245); g.add(hair);
  box(0.3, 0.5, 0.02, new THREE.MeshStandardMaterial({ color: 0xf2f0e6 }), 0, 1.12, 0.138, g); // shirt
  box(0.05, 0.18, 0.02, new THREE.MeshStandardMaterial({ color: 0xd64545 }), 0, 1.22, 0.15, g); // tie
  box(0.4, 0.1, 0.5, new THREE.MeshStandardMaterial({ color: 0x333a44 }), 0, 0.72, 0.3, g); // lap
  // chair
  box(0.5, 0.05, 0.48, M.plastic, 0, 0.62, 0.34, g);
  box(0.5, 0.6, 0.05, M.plastic, 0, 1.0, 0.6, g);
  box(0.06, 0.6, 0.06, M.metal, 0, 0.3, 0.34, g);
  // arms: shoulder groups so the right arm can reach for the phone
  const armL = new THREE.Group(); armL.position.set(-0.28, 1.32, 0.22); g.add(armL);
  box(0.09, 0.09, 0.42, suitMat, 0, -0.06, -0.16, armL);
  const armR = new THREE.Group(); armR.position.set(0.28, 1.32, 0.22); g.add(armR);
  box(0.09, 0.09, 0.42, suitMat, 0, -0.06, -0.16, armR);
  const handR = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), new THREE.MeshStandardMaterial({ color: skin })); handR.position.set(0, -0.06, -0.38); armR.add(handR);
  const handL = handR.clone(); handL.position.set(0, -0.06, -0.38); armL.add(handL);
  return { group: g, armL, armR, suitMat };
}
const SUITS = [0x3f7d7a, 0x35507a, 0x27364f, 0x5a4632, 0x1d1d22, 0x4a3520];
const myDesk = buildDesk(scene, 0, 1.05, { mug: 0x3a86ff, phoneX: 0.36, phoneZ: 0.16 });
const leftDesk = buildDesk(scene, -1.05, -0.6, { mug: 0xd64545, phoneX: -0.48 });
leftDesk.group.rotation.y = Math.PI;
const rightDesk = buildDesk(scene, 2.75, 0.75, { mug: 0x2e933c });
rightDesk.group.position.set(1.05, 0, -0.6); rightDesk.group.rotation.y = Math.PI;
const leftPerson = buildPerson(scene, -1.05, -0.6, SUITS[0], 0xf2c9a0);
leftPerson.group.position.z = -1.17; leftPerson.group.rotation.y = Math.PI;
const rightPerson = buildPerson(scene, 2.75, 0.75, SUITS[1], 0xe8b98d);
rightPerson.group.position.set(1.05, 0, -1.17); rightPerson.group.rotation.y = Math.PI;
/* name plates */
function plateTex(text) { return makeTex(256, 64, (g, w, h) => { g.fillStyle = '#f5f2e8'; g.fillRect(0, 0, w, h); g.strokeStyle = '#8a7a4f'; g.lineWidth = 4; g.strokeRect(2, 2, w - 4, h - 4); g.fillStyle = '#333'; g.font = 'bold 30px sans-serif'; g.textAlign = 'center'; g.fillText(text, w / 2, 43); }); }
const plateL = new THREE.Mesh(new THREE.PlaneGeometry(0.44, 0.11), new THREE.MeshBasicMaterial({ map: plateTex('タナカ') })); plateL.position.set(-1.05, 0.87, -0.13); scene.add(plateL);
const plateR = plateL.clone(); plateR.position.set(1.05, 0.87, -0.13); scene.add(plateR);
/* player's own arms */
const myArmR = new THREE.Group(); myArmR.position.set(0.34, 0.86, 1.78); scene.add(myArmR);
box(0.09, 0.09, 0.5, new THREE.MeshStandardMaterial({ color: 0x35507a }), 0, 0, -0.2, myArmR);
const myHand = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), new THREE.MeshStandardMaterial({ color: 0xf2c9a0 })); myHand.position.set(0, 0, -0.46); myArmR.add(myHand);
const myArmL = new THREE.Group(); myArmL.position.set(-0.34, 0.86, 1.78); scene.add(myArmL);
box(0.09, 0.09, 0.5, new THREE.MeshStandardMaterial({ color: 0x35507a }), 0, 0, -0.2, myArmL);
const NAMES = ['タナカ', 'スズキ', 'サトウ', 'ヤマダ', 'オオタ', 'ベル'];
let lastStage = -1, lastLeft = null, lastRight = null;
const v3 = new THREE.Vector3();
function anchor(which) {
  const d = which === 'me' ? myDesk : which === 'left' ? leftDesk : rightDesk;
  const v = new THREE.Vector3();
  d.phone.group.getWorldPosition(v); v.y += 0.42;
  v.project(camera);
  return { nx: (v.x + 1) / 2, ny: (1 - v.y) / 2 };
}
function phoneScreen() {
  v3.copy(myDesk.phone.group.position); v3.y += 0.1;
  myDesk.group.localToWorld ? null : 0;
  const p = v3.clone(); p.x += 0; // myDesk group at (0,0,1.05): phone world = group pos + local
  p.set(myDesk.phone.group.position.x + 0, myDesk.phone.group.position.y + 0.1, myDesk.phone.group.position.z + 1.05);
  p.project(camera);
  return { nx: (p.x + 1) / 2, ny: (1 - p.y) / 2 };
}
function setPerson(person, desk, grab, working, t, side) {
  // typing bob while working
  const bob = working ? Math.sin(t * 13 + (side === 'left' ? 0 : 2)) * 0.02 : 0;
  person.armL.position.y = 1.32 + bob;
  person.armR.position.y = 1.32 - bob;
  // reach with the phone-side arm (left rival: his left; right rival: his right)
  const arm = side === 'left' ? person.armL : person.armR;
  arm.rotation.x = grab * 0.55;
  arm.position.z = 0.22 + grab * 0.14;
  desk.phone.recv.position.y = 0.1 + grab * 0.17;
  desk.phone.recv.position.z = -0.1 + grab * 0.14;
  desk.phone.recv.rotation.x = grab * 0.5;
}
function ringFx(desk, on, t) {
  const p = desk.phone;
  if (on) {
    p.group.position.x = p.basePos.x + Math.sin(t * 70) * 0.006;
    p.group.position.z = p.basePos.z + Math.cos(t * 63) * 0.006;
    p.lampMat.emissiveIntensity = (Math.sin(t * 14) > 0 ? 2.2 : 0.1);
  } else {
    p.group.position.x = p.basePos.x; p.group.position.z = p.basePos.z;
    p.lampMat.emissiveIntensity = 0;
  }
}
function frame(s) {
  const t = s.t;
  if (s.stage !== lastStage || s.leftOn !== lastLeft || s.rightOn !== lastRight) {
    lastStage = s.stage; lastLeft = s.leftOn; lastRight = s.rightOn;
    leftPerson.suitMat.color.setHex(SUITS[s.stage]);
    plateL.material.map = plateTex(NAMES[s.stage]); plateL.material.needsUpdate = true;
    const rIdx = s.stage < 2 ? -1 : s.stage === 4 ? 3 : s.stage - 1;
    rightPerson.group.visible = rIdx >= 0; rightDesk.group.visible = rIdx >= 0; plateR.visible = rIdx >= 0;
    if (rIdx >= 0) { rightPerson.suitMat.color.setHex(SUITS[rIdx]); plateR.material.map = plateTex(NAMES[rIdx]); plateR.material.needsUpdate = true; }
  }
  ringFx(myDesk, !!s.ring, t);
  ringFx(leftDesk, !!s.ring && s.leftOn, t);
  ringFx(rightDesk, !!s.ring && s.rightOn, t);
  setPerson(leftPerson, leftDesk, s.leftGrab, s.working, t, 'left');
  setPerson(rightPerson, rightDesk, s.rightGrab, s.working, t, 'right');
  // my receiver + arm
  myDesk.phone.recv.position.y = 0.1 + s.meGrab * 0.2;
  myDesk.phone.recv.position.z = -0.1 + s.meGrab * 0.3;
  myDesk.phone.recv.rotation.x = s.meGrab * 0.6;
  myArmR.position.z = 1.78 - s.meGrab * 0.5;
  myArmR.position.x = 0.34 + s.meGrab * 0.12;
  myArmR.position.y = 0.86 + s.meGrab * 0.12 + (s.working ? Math.sin(t * 12) * 0.008 : 0);
  myArmL.position.y = 0.86 + (s.working ? Math.cos(t * 12) * 0.008 : 0);
  // wall clock (real-ish motion)
  const ck = scene.userData.clock; if (ck) { ck.userData.hM.rotation.z = -t * 0.02; ck.userData.hH.rotation.z = -t * 0.0017; }
  camera.position.x = Math.sin(t * 0.4) * 0.02;
  camera.position.y = 1.66 + Math.sin(t * 0.7) * 0.008;
  camera.lookAt(0, 0.9, -0.3);
  renderer.render(scene, camera);
}
function resize() { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); }
addEventListener('resize', resize);
window.R3D = { frame, phoneScreen, resize, anchor };
renderer.render(scene, camera);
